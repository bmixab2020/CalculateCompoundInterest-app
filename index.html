<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>
    <link rel="stylesheet" href="style.css?v=1">
</head>

<body>
    <div class="container">
        <h1>Compound Interest Calculator</h1>
        <form id="compoundForm" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="savingAmount">Saving amount ($/mo)</label>
                    <input type="text" inputmode="decimal" id="savingAmount" placeholder="$200" required>
                </div>
                <div class="form-group">
                    <label for="apr">Compound APR (%)</label>
                    <input type="text" inputmode="decimal" id="apr" placeholder="7%" required>
                </div>
                <div class="form-group">
                    <label for="term">Term (Years)</label>
                    <input type="number" inputmode="numeric" id="term" min="1" max="60" value="40" required>
                </div>
            </div>
            <div class="button-row">
                <button type="submit" id="calculateBtn">Calculate</button>
                <button type="button" id="printBtn">Print(PDF)</button>
            </div>
        </form>
        <div id="formError" class="form-error" role="alert" aria-live="assertive" hidden></div>
        <div id="summary" class="result hidden"></div>
        <div id="schedule" class="schedule hidden"></div>
    </div>
    <script src="script.js?v=1"></script>
</body>

</html>
